<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f8f6f0" />
    <title>Page not found | Wisdom Benson</title>
    <style>
      :root {
        color: #18202f;
        background: #f8f6f0;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      section {
        width: min(100%, 44rem);
        border-top: 2px solid #225fd6;
        padding-top: 2rem;
      }

      p {
        max-width: 34rem;
        color: #5a6270;
        font-size: 1rem;
        line-height: 1.7;
      }

      .index {
        color: #225fd6;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 10ch;
        margin: 1rem 0;
        font-size: clamp(3rem, 10vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.055em;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 1rem;
        border-radius: 0.4rem;
        background: #225fd6;
        padding: 0.75rem 1rem;
        color: white;
        font-weight: 650;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #225fd6;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <span class="index">404 · Outside the dataset</span>
        <h1>That page is not here.</h1>
        <p>The address may have changed, or the page may no longer be part of this research record.</p>
        <a href="/">Return to the portfolio</a>
      </section>
    </main>
  </body>
</html>
